version: 2
updates:
  # All GitHub Actions bumps arrive as ONE monthly pull request
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }

  # iOS wrapper: Capacitor packages move together; major versions are upgraded by hand
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      capacitor: { patterns: ["@capacitor/*"] }
    ignore:
      - dependency-name: "@capacitor/*"
        update-types: ["version-update:semver-major"]

  # Desktop wrapper: Electron major versions are upgraded by hand
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: electron
        update-types: ["version-update:semver-major"]

  # Android wrapper: patch and minor only
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
