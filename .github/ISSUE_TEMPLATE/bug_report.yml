name: Bug report
description: Something is broken or behaves wrongly
labels: [bug]
body:
  - type: markdown
    attributes: { value: "Thanks for the report. Please search existing issues first." }
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android app, iPhone/iPad app, Web/PWA, Windows, macOS, Linux]
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Hazen version, description: "Settings > Hazen, or the release name" }
    validations: { required: true }
  - type: input
    id: device
    attributes: { label: Device and OS version, placeholder: "Pixel 8, Android 15" }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, placeholder: "1. Open Camera\n2. ..." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected and actual behaviour }
    validations: { required: true }
  - type: textarea
    id: extra
    attributes: { label: Screenshots, video or logs, description: "Drag files here. Do not include private photos." }
