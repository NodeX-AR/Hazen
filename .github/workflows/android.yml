name: Build Android (APK + Play Store AAB)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (for example v1.0.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      VERSION_CODE: ${{ github.run_number }}
      TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }

      - name: Put the app and the on-device AI models inside the Android app
        shell: bash
        run: |
          set -e
          test -f demo.html
          mkdir -p android/app/src/main/assets
          cp demo.html android/app/src/main/assets/index.html
          node scripts/fetch-models.mjs android/app/src/main/assets/models

      - name: Version name from the tag
        if: env.TAG != ''
        shell: bash
        run: echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"

      - name: Debug APK (always)
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Signed release (needs the keystore secrets)
        if: env.KS_B64 != ''
        working-directory: android
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_PASSWORD is missing or empty. Add it under Settings > Secrets and variables > Actions."; exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/ks.txt" 2>&1; then
            cat "$RUNNER_TEMP/ks.txt"; echo "::error::Could not open the keystore. ANDROID_KEYSTORE_PASSWORD is wrong, or ANDROID_KEYSTORE_BASE64 is not a valid .jks file."; exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            KEY_ALIAS=$(grep -m1 'PrivateKeyEntry' "$RUNNER_TEMP/ks.txt" | cut -d, -f1)
            echo "ANDROID_KEY_ALIAS not set; using the keystore's key: $KEY_ALIAS"
          fi
          if [ -z "$KEY_ALIAS" ]; then cat "$RUNNER_TEMP/ks.txt"; echo "::error::No private key found in the keystore."; exit 1; fi
          if [ -z "$KEY_PASSWORD" ]; then KEY_PASSWORD="$KEYSTORE_PASSWORD"; fi
          export KEY_ALIAS KEY_PASSWORD KEYSTORE_PASSWORD
          gradle bundleRelease assembleRelease --no-daemon

      - name: Collect the files people download (fixed names, so download links never change)
        shell: bash
        run: |
          mkdir -p dist
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist/Hazen.apk
            cp android/app/build/outputs/bundle/release/app-release.aab dist/Hazen.aab
          else
            echo "No signing keys found: publishing the debug build as Hazen.apk (installable, but not for Google Play)."
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/Hazen.apk
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Hazen-android
          path: dist/*

      - name: Publish to the GitHub Release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Hazen $TAG" --generate-notes --target "$GITHUB_SHA" || true
          gh release upload "$TAG" dist/* --clobber
